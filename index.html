<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mostrador · Almacén La Esquina</title>
  <meta name="description" content="Demo de pedidos para retirar y control de stock para almacenes de barrio.">
  <meta name="theme-color" content="#e9eee8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d5c43'/%3E%3Cpath d='M6 10h20v4c0 1.7-1.3 3-3 3s-3-1.3-3-3c0 1.7-1.3 3-3 3s-3-1.3-3-3c0 1.7-1.3 3-3 3s-3-1.3-3-3z' fill='%23f3f6f2'/%3E%3Cpath d='M9 19h14v6H9z' fill='%23f3f6f2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="frame-bar">
    <a class="brand" href="#cliente" aria-label="Mostrador, inicio">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="currentColor"/>
        <path d="M6 10h20v4c0 1.7-1.3 3-3 3s-3-1.3-3-3c0 1.7-1.3 3-3 3s-3-1.3-3-3c0 1.7-1.3 3-3 3s-3-1.3-3-3z" fill="#f3f6f2"/>
        <path d="M9 19h14v6H9z" fill="#f3f6f2"/>
      </svg>
      <span class="brand-text"><strong>Mostrador</strong><span class="brand-store" data-store-name>Almacén La Esquina</span></span>
    </a>
    <nav class="views" aria-label="Pantallas de la demo">
      <a href="#cliente" data-view-link="cliente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>
        <span class="lbl-long">App del cliente</span><span class="lbl-short">Cliente</span>
      </a>
      <a href="#pedidos" data-view-link="pedidos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg>
        <span>Pedidos</span><span class="count-badge" data-new-badge hidden></span>
      </a>
      <a href="#stock" data-view-link="stock">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>
        <span>Stock</span>
      </a>
    </nav>
    <button class="btn-ghost reset" type="button" data-action="reset-demo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      <span>Reiniciar demo</span>
    </button>
  </header>

  <main class="sheet" id="main">
    <section id="view-cliente" class="view view-cliente" hidden aria-labelledby="cliente-title"></section>
    <section id="view-pedidos" class="view view-pedidos" hidden aria-labelledby="pedidos-title"></section>
    <section id="view-stock" class="view view-stock" hidden aria-labelledby="stock-title"></section>
  </main>

  <div class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
